<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">NodeMCU ESP8266 and ultrasonic sensor wiring</title>
  <desc id="desc">Wiring diagram: VCC, GND, Trig and Echo between NodeMCU and JSN-SR04T or AJ-SR04M</desc>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f7a52"/>
      <stop offset="100%" stop-color="#1f5a3b"/>
    </linearGradient>
    <linearGradient id="module" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4654"/>
      <stop offset="100%" stop-color="#273140"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5b6b63"/>
    </marker>
  </defs>

  <rect width="720" height="420" rx="18" fill="#f4f8f6"/>
  <text x="24" y="36" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#145c42">Physical wiring - Level sensor</text>
  <text x="24" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#5b6b63">NodeMCU ESP8266 (v2) + JSN-SR04T / AJ-SR04M</text>

  <g transform="translate(48,90)">
    <rect width="210" height="260" rx="14" fill="url(#board)" stroke="#124a32" stroke-width="2"/>
    <text x="105" y="28" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">NodeMCU</text>
    <text x="105" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#d7efe3">ESP8266</text>
    <rect x="70" y="62" width="70" height="46" rx="6" fill="#1a1f24" stroke="#0e1216"/>
    <text x="105" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#9aa7b5">USB</text>

    <g font-family="ui-monospace, monospace" font-size="11" fill="#e8f6ef">
      <rect x="14" y="120" width="78" height="22" rx="5" fill="#16382c"/>
      <text x="53" y="135" text-anchor="middle">VIN / 5V</text>
      <rect x="14" y="152" width="78" height="22" rx="5" fill="#16382c"/>
      <text x="53" y="167" text-anchor="middle">GND</text>
      <rect x="14" y="184" width="78" height="22" rx="5" fill="#16382c"/>
      <text x="53" y="199" text-anchor="middle">D1 GPIO5</text>
      <rect x="14" y="216" width="78" height="22" rx="5" fill="#16382c"/>
      <text x="53" y="231" text-anchor="middle">D2 GPIO4</text>
    </g>
  </g>

  <g transform="translate(430,110)">
    <rect width="240" height="220" rx="14" fill="url(#module)" stroke="#1c2430" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">Ultrasonic</text>
    <text x="120" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#b7c2d0">JSN-SR04T / AJ-SR04M</text>
    <circle cx="78" cy="95" r="28" fill="#1f2935" stroke="#8fa0b5" stroke-width="3"/>
    <circle cx="162" cy="95" r="28" fill="#1f2935" stroke="#8fa0b5" stroke-width="3"/>
    <text x="78" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#c5d0dc">TX</text>
    <text x="162" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#c5d0dc">RX</text>

    <g font-family="ui-monospace, monospace" font-size="12" fill="#eef3f8">
      <rect x="28" y="140" width="70" height="24" rx="5" fill="#111821"/>
      <text x="63" y="156" text-anchor="middle">VCC</text>
      <rect x="28" y="172" width="70" height="24" rx="5" fill="#111821"/>
      <text x="63" y="188" text-anchor="middle">GND</text>
      <rect x="142" y="140" width="70" height="24" rx="5" fill="#111821"/>
      <text x="177" y="156" text-anchor="middle">Trig</text>
      <rect x="142" y="172" width="70" height="24" rx="5" fill="#111821"/>
      <text x="177" y="188" text-anchor="middle">Echo</text>
    </g>
  </g>

  <g fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M258 221 H360 V168 H458" stroke="#c62828"/>
    <path d="M258 253 H340 V200 H458" stroke="#263238"/>
    <path d="M258 285 H380 V168 H570" stroke="#1565c0"/>
    <path d="M258 317 H400 V200 H570" stroke="#2e7d32"/>
  </g>

  <g transform="translate(48,368)" font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <rect width="14" height="14" rx="3" fill="#c62828"/><text x="22" y="12" fill="#31463c">VIN/5V -&gt; VCC</text>
    <rect x="150" width="14" height="14" rx="3" fill="#263238"/><text x="172" y="12" fill="#31463c">GND -&gt; GND</text>
    <rect x="290" width="14" height="14" rx="3" fill="#1565c0"/><text x="312" y="12" fill="#31463c">D1 -&gt; Trig</text>
    <rect x="420" width="14" height="14" rx="3" fill="#2e7d32"/><text x="442" y="12" fill="#31463c">D2 -&gt; Echo</text>
  </g>
</svg>
